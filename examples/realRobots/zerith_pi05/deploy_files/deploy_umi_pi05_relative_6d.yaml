# UMI · PI05 relative-6d 部署 overlay (Zenoh serve / 离线 infer)
#
# 跟 ckpt 的 config.yaml OmegaConf.merge 使用 (语义同 open-eval
# eval_starvla.load_merged_config: 后者覆盖前者)。本 overlay **只放部署相关字段**,
# 模型/数据/训练超参全部从 ckpt config 继承 (framework.*, datasets.*)。
#
# 对应 embodiment: umi_2gripper_relative_6d (data_mix=shenzhen_relative_6d,
# 见 train_files/data_registry/data_config.py)。
#
# 配置来源: 本 yaml (framework.tokenizer + deploy: 段) 覆盖 ckpt config; 代码仅兜底默认。
# CLI 只接 --checkpoint / --deploy-yaml; 改部署参数 (device/dtype/addr/...) 就改本 yaml。
#
# 用法 (serve, starVLA conda env 有 zenoh):
#   PYTHONPATH=/home/zerith/ws/orion/starvla \
#   /home/zerith/miniforge3/envs/starVLA/bin/python -m deployment.model_server.server_umi_pi05_rio serve \
#     --checkpoint /home/zerith/.models/run_umi_shenzhen_relative_6d_20000step_0727_100151 \
#     --deploy-yaml examples/realRobots/zerith_pi05/deploy_files/deploy_umi_pi05_relative_6d.yaml
#
# ── 覆盖 ckpt config 里训练机本机缺失的资产路径 ──────────────────────────
framework:
  tokenizer:
    # ckpt config 指训练机 /nix/data/paligemma-3b-pt-224/tokenizer.model (本机缺失),
    # LazyPaliGemmaTokenizer predict 时才加载 → 在此指到本地副本。
    # (resolve_tokenizer_path: 文件存在就用; 缺失则回退 env STARVLA_PALIGEMMA_TOKENIZER;
    #  都没有则报错, 提示改这里。)
    model_path: /home/zerith/.cache/openpi/big_vision/paligemma_tokenizer.model

# ── 部署运行参数 (改这里, 不走 CLI) ──────────────────────────────────────
deploy:
  device: cuda:0               # torch device
  dtype: bf16                  # torch_dtype 短名: bf16 / fp16 / fp32
  listen_addr: 127.0.0.1:5570  # Zenoh 监听地址 (z-rio 客户端连这里)
  key_prefix: z-rio/starvla    # Zenoh key 前缀
  unnorm_key: null             # dataset_statistics.json 顶层键; null=单键自动选
  shutdown_timeout: 5.0        # Zenoh 清理超过该秒数则强制退出 (释放显存)
