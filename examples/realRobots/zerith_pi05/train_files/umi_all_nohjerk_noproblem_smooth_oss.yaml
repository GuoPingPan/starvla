
run_id: starvla_pi05_umi_relative_6d_all_nohjerk_noproblem_smooth_oss
run_root_dir: /nix/data/model_outputs
seed: 42
wandb_entity: zumi_test
wandb_project: umi_relative_6d_pi05
tracker_type: swanlab
is_debug: false

# PI05 框架配置
framework:
  name: PI05
  precision: bfloat16
  action_dim: 32
  action_horizon: 50
  max_state_dim: 32
  discrete_state_input: false
  max_token_len: 200
  num_inference_steps: 10
  tokenizer:
    model_path: /root/data/pretrain_models/paligemma-3b-pt-224/tokenizer.model
    pad_state_value: -2.0
  use_sdpa: true          # joint attention 走 SDPA (env STARVLA_USE_SDPA 可覆盖)
  compile: default            # torch.compile 热路径 (env STARVLA_COMPILE 可覆盖; 首步编译 ~3min; ⚠️ max-autotune 在 8 卡会因各 rank 独立调优+NCCL 互等而死锁, 勿用)
  paligemma:
    model_name_or_path: ""

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: /root/data/z-umi/data
    data_mix: umi_all_nohjerk_noproblem_smooth_oss  # 同上 85 子集, 但第4元素为阿里云 OSS 目录 URI (oss://algo-public0/orion/datasets/z-umi/<id>/), 供 OSS 环境直接拉取 (~15.8GB)
    action_type: delta_ee
    action_mode: abs
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true
    load_all_data_for_training: true
    lerobot_version: v3.0
    video_backend: torchvision_av
    collate_image_tensors: true   # 图像张量化下沉 worker (env STARVLA_COLLATE_TENSORS 可覆盖); 需 transform 末端已 resize 到模型分辨率
    action_dim_actual: 10
    split:
      enabled: true
      train_percent: 90
    # EEF-speed conditioning: 这 85 个子集暂无 meta/episode_speed.json,
    # _get_speed_token 对缺失自动返回空串 (datasets.py:1592-1594), 不影响训练;
    # 需要时先跑 scripts/compute_eef_speed.py 生成。
    speed_conditioning: true
    speed_prompt_format: raw      # "bin" (0..9) or "raw" (m/s)
    speed_num_bins: 10
    speed_dropout_prob: 0.15      # train-only CFG dropout of the whole token

trainer:
  pretrained_checkpoint: /root/data/pretrain_models/pi05_base_starvla/pi05_base_starvla/fp32/model.safetensors
  is_resume: false
  max_train_steps: 10000
  num_warmup_steps: 1000
  save_interval: 2000
  # 在线 action eval (eval split 单 batch, normalized 空间 MSE), 结果写 SwanLab 的
  # eval/mse 曲线。每次开销 ≈ 0.5 train step (predict_action 有 prefix KV-cache 优化),
  # eval_interval=20 → 总开销占比 ≈ 2.5%。
  # ⚠️ 须为 logging_frequency (=10) 的整数倍: eval 算出的 mse 经 _log_metrics 写 tracker,
  #    而 _log_metrics 受 logging_frequency 门控 (train_starvla.py:423), 非其倍数时 eval
  #    算了却不进 tracker, 曲线会缺点。设 100000000 = 禁用 eval。
  eval_interval: 100000000   # 调试: 关闭内联 eval (设 20 恢复)
  learning_rate:
    base: 5.0e-05
    action_model: 2.0e-04
    paligemma: 5.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 1.0e-02
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-02
  save_format: pt
