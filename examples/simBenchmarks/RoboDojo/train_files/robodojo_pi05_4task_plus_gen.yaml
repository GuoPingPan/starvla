
# RoboDojo PI05 4 任务消融 — 实验组：官方 4 任务子集 + mcap 闭环采集生成数据。
# 任务: cover_blocks / deposit_coin / fold_clothes / stack_blocks (同 base)
# 数据: robodojo_ee_4task_plus_gen =
#         RoboDojo_ee_4task_v30        (官方 4 任务子集, 400 集 / ~130k 帧)
#       + RoboDojo_gen_mcap100_4task_v30 (生成数据 404 集 / ~129k 帧,
#         scripts/dev/mcap_to_lerobot_v30.py 自 /mnt/cfs/robodojo_expert_mcap_100 转出)
# 对照组: robodojo_pi05_4task_base.yaml (仅官方 4 任务)。

run_id: starvla_pi05_robodojo_4task_plus_gen
run_root_dir: /root/data/model_outputs
seed: 42
wandb_entity: robodojo_test
wandb_project: robodojo_pi05_4task
tracker_type: swanlab
is_debug: false

# PI05 框架配置（沿用 zerith_pi05 模板：action_dim/state pad 到 32 匹配预训练 ckpt）
framework:
  name: PI05
  precision: bfloat16
  action_dim: 32
  action_horizon: 50
  max_state_dim: 32
  discrete_state_input: false
  max_token_len: 200
  num_inference_steps: 10
  tokenizer:
    model_path: /root/data/pretrain_models/paligemma-3b-pt-224/tokenizer.model
    pad_state_value: -2.0
  paligemma:
    model_name_or_path: ""

# RoboDojo 双臂数据集（SE(3) 相对位姿 + rotation_6d）
# 最终 action/state 维度: 左[pos3+rot6d6+grip1] + 右[pos3+rot6d6+grip1] = 20D，pad 到 32
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /root/data/robodojo
    data_mix: robodojo_ee_4task_plus_gen
    action_type: delta_ee
    action_mode: abs            # SE(3) 相对化由 RelativePoseTransform 处理
    per_device_batch_size: 16
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    load_all_data_for_training: true
    lerobot_version: v3.0
    video_backend: torchvision_av
    action_dim_actual: 20       # 实际动作维度（左10 + 右10）

trainer:
  pretrained_checkpoint: /root/data/pretrain_models/pi05_base_starvla/pi05_base_starvla/fp32/model.safetensors
  is_resume: false
  max_train_steps: 20000
  num_warmup_steps: 500
  save_interval: 2500
  eval_interval: 100000000
  learning_rate:
    base: 5.0e-05
    action_model: 2.0e-04
    paligemma: 5.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''             # 全参微调(对齐 full_50k 基线); 冻结 vlm 已实测显著掉点
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 1.0e-02
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-02
  save_format: pt
