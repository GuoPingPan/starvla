# Single-task PI0.5 fine-tuning on the 195 successful make_kong
# official_push_postures_v2 rollouts. Convert the source NPZ + MP4 files to
# /mnt/cfs/data/robodojo/RoboDojo_make_kong_v30 before training. In the
# BaiGe job, /root/data is a symlink to /mnt/cfs/data.
# The converter retains the commanded action[t] after observation.state[t].

run_id: starvla_pi05_robodojo_make_kong_v2
run_root_dir: /root/data/model_outputs
seed: 42
wandb_entity: robodojo_test
wandb_project: robodojo_pi05_make_kong
tracker_type: swanlab
is_debug: false

framework:
  name: PI05
  precision: bfloat16
  action_dim: 32
  action_horizon: 50
  max_state_dim: 32
  discrete_state_input: false
  max_token_len: 200
  num_inference_steps: 10
  tokenizer:
    model_path: /root/data/pretrain_models/paligemma-3b-pt-224/tokenizer.model
    pad_state_value: -2.0
  paligemma:
    model_name_or_path: ""

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /root/data/robodojo
    data_mix: robodojo_make_kong_v2
    action_type: delta_ee
    action_mode: abs            # RelativePoseTransform converts absolute commands to SE(3) deltas.
    per_device_batch_size: 4
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true
    load_all_data_for_training: true
    lerobot_version: v3.0
    video_backend: torchvision_av
    action_dim_actual: 20       # Two arms, each [position3, rotation6d6, gripper1].

trainer:
  pretrained_checkpoint: /root/data/pretrain_models/pi05_base_starvla/pi05_base_starvla/fp32/model.safetensors
  is_resume: false
  max_train_steps: 20000
  num_warmup_steps: 500
  save_interval: 2500
  eval_interval: 100000000
  learning_rate:
    base: 5.0e-05
    action_model: 2.0e-04
    paligemma: 5.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 1.0e-02
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-02
  save_format: pt
